<!DOCTYPE html>
<html lang="nb">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Kakekalender</title>
<link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <h1>🎂 Kakekalender</h1>
    <div id="auth-area"></div>
  </header>

  <main>
    <section id="admin-form-section" class="card hidden">
      <h2>Legg til ny oppføring</h2>
      <form id="entry-form">
        <input type="hidden" id="entry-id" />
        <label>
          Dato
          <input type="date" id="entry-date" required />
        </label>
        <label>
          Navn
          <input type="text" id="entry-name" placeholder="Hvem skal ha med kake?" required />
        </label>
        <label>
          Notat (valgfritt)
          <input type="text" id="entry-note" placeholder="F.eks. bursdag, sjokoladekake..." />
        </label>
        <div class="form-actions">
          <button type="submit" id="entry-submit">Legg til</button>
          <button type="button" id="entry-cancel" class="secondary hidden">Avbryt</button>
        </div>
      </form>
    </section>

    <section id="list-section">
      <h2>Kommende kakedager</h2>
      <p id="empty-state" class="hidden">Ingen oppføringer enda.</p>
      <ul id="entry-list"></ul>
    </section>
  </main>

  <div id="login-modal" class="modal hidden">
    <div class="modal-content">
      <h2>Admin-innlogging</h2>
      <form id="login-form">
        <label>
          Brukernavn
          <input type="text" id="login-username" autocomplete="username" required />
        </label>
        <label>
          Passord
          <input type="password" id="login-password" autocomplete="current-password" required />
        </label>
        <p id="login-error" class="error hidden"></p>
        <div class="form-actions">
          <button type="submit">Logg inn</button>
          <button type="button" id="login-cancel" class="secondary">Avbryt</button>
        </div>
      </form>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
